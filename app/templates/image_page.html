<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MvpMosaic</title>
    <link rel="icon" href="/static/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Шапка -->
        <header class="mb-4">
            <h1 class="h2 mb-0">MvpMosaic</h1>
        </header>

        <main>
            <div class="row g-4 mb-4">
                <div class="col-lg-6">
                    <div class="card h-100">
                        <div class="card-header d-flex justify-content-between align-items-center py-2">
                            <h5 class="mb-0">Оригинальное изображение</h5>
                            <div class="d-flex gap-2">
                                <button id="resetImageBtn" class="btn btn-outline-secondary btn-sm" title="Сбросить к дефолтному изображению">
                                    🔄 Сбросить
                                </button>
                                <button id="uploadBtn" class="btn btn-primary btn-sm">
                                    📁 Загрузить
                                </button>
                            </div>
                            <input type="file" id="fileInput" accept="image/*" style="display:none">
                        </div>
                        <div class="card-body d-flex align-items-center">
                            <div class="image-wrapper w-100" id="dropZone">
                                <img id="originalImage" alt="Оригинал" class="img-fluid">
                                <div id="imageLoadingOverlay" class="position-absolute top-0 start-0 w-100 h-100 d-none align-items-center justify-content-center" style="background: rgba(255,255,255,0.75); z-index: 10; border-radius: 8px;">
                                    <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
                                        <span class="visually-hidden">Загрузка...</span>
                                    </div>
                                </div>
                                <div id="dropOverlay" class="position-absolute top-0 start-0 w-100 h-100 d-none align-items-center justify-content-center" style="background: rgba(0,0,0,0.5); z-index: 10; border-radius: 8px; color: white;">
                                    <div class="text-center">
                                        <div style="font-size: 3rem;">📤</div>
                                        <div class="mt-2">Отпустите изображение</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="card h-100">
                        <div class="card-header d-flex justify-content-between align-items-center py-2">
                            <h5 class="mb-0">Мозаика</h5>
                            <span id="mosaicStatus" class="badge bg-success">Готово</span>
                        </div>
                        <div class="card-body position-relative d-flex align-items-center">
                            <div class="image-wrapper w-100">
                                <canvas id="mosaicCanvas"></canvas>
                                <div id="mosaicLoadingOverlay" class="position-absolute top-0 start-0 w-100 h-100 d-none align-items-center justify-content-center" style="background: rgba(255,255,255,0.75); z-index: 10; border-radius: 8px;">
                                    <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
                                        <span class="visually-hidden">Загрузка...</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Настройки -->
            <div class="row mb-4">
                <div class="col-12">
                    <div class="card">
                        <div class="card-body">
                            <div class="row align-items-stretch">
                                <div class="col-md-10">
                                    <form id="settingsForm">
                                        <!-- Ширина полотна -->
                                        <div class="row align-items-center mb-3">
                                            <div class="col-md-3">
                                                <label for="canvasWidthSlider" class="form-label fw-bold mb-0">Ширина полотна:</label>
                                            </div>
                                            <div class="col-md-7">
                                                <input type="range" id="canvasWidthSlider" class="form-range" min="200" max="5000" step="1" value="1000">
                                            </div>
                                            <div class="col-md-2">
                                                <input type="number" id="canvasWidthInput" class="form-control" min="200" max="5000" value="1000">
                                            </div>
                                        </div>

                                        <!-- Размер ячейки -->
                                        <div class="row align-items-center mb-3">
                                            <div class="col-md-3">
                                                <label for="cellSizeSlider" class="form-label fw-bold mb-0">Размер ячейки:</label>
                                            </div>
                                            <div class="col-md-7">
                                                <input type="range" id="cellSizeSlider" class="form-range" min="5" max="50" step="1" value="15">
                                            </div>
                                            <div class="col-md-2">
                                                <input type="number" id="cellSizeInput" class="form-control" min="5" max="50" value="15">
                                            </div>
                                        </div>

                                        <!-- Ширина шва -->
                                        <div class="row align-items-center mb-3">
                                            <div class="col-md-3">
                                                <label for="gapSlider" class="form-label fw-bold mb-0">Ширина шва:</label>
                                            </div>
                                            <div class="col-md-7">
                                                <input type="range" id="gapSlider" class="form-range" min="0" max="10" step="1" value="2">
                                            </div>
                                            <div class="col-md-2">
                                                <input type="number" id="gapInput" class="form-control" min="0" max="10" value="2">
                                            </div>
                                        </div>

                                        <!-- Количество цветов -->
                                        <div class="row align-items-center">
                                            <div class="col-md-3">
                                                <label for="colorsSlider" class="form-label fw-bold mb-0">Кол-во цветов:</label>
                                            </div>
                                            <div class="col-md-7">
                                                <input type="range" id="colorsSlider" class="form-range" min="2" max="50" step="1" value="15">
                                            </div>
                                            <div class="col-md-2">
                                                <input type="number" id="colorsInput" class="form-control" min="2" max="50" value="15">
                                            </div>
                                        </div>
                                    </form>
                                </div>

                                <div class="col-md-2 d-flex align-items-stretch">
                                    <button type="button" id="resetSettingsBtn" class="btn btn-outline-secondary w-100 h-100 d-flex align-items-center justify-content-center">
                                        Сбросить<br>настройки
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Сводка -->
            <div class="row mb-4">
                <div class="col-12">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="mb-0">📊 Сводка</h5>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-3 col-6 mb-2">
                                    <div class="fw-bold text-muted small">Размеры полотна</div>
                                    <div>
                                        <span id="summaryCanvasWidth" style="font-weight: 600; color: #0d6efd;">--</span> × 
                                        <span id="summaryCanvasHeight" style="font-weight: 600; color: #0d6efd;">--</span>
                                    </div>
                                </div>
                                <div class="col-md-3 col-6 mb-2">
                                    <div class="fw-bold text-muted small">Размер ячейки</div>
                                    <div><span id="summaryCellSize" style="font-weight: 600; color: #0d6efd;">--</span></div>
                                </div>
                                <div class="col-md-3 col-6 mb-2">
                                    <div class="fw-bold text-muted small">Всего ячеек</div>
                                    <div><span id="summaryTotalCells" style="font-weight: 600; color: #0d6efd;">--</span></div>
                                </div>
                                <div class="col-md-3 col-6 mb-2">
                                    <div class="fw-bold text-muted small">Ширина шва</div>
                                    <div><span id="summaryGap" style="font-weight: 600; color: #0d6efd;">--</span></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Палитра -->
            <div class="row mb-4">
                <div class="col-12">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="mb-0">🎨 Палитра (<span id="paletteColorCount">{{ scheme.n_colors }}</span> цветов)</h5>
                        </div>
                        <div class="card-body">
                            <div id="colorPalette" class="d-flex flex-wrap gap-2">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="mt-4 text-center text-muted">
            <small>
                &copy; 2026 
                <a href="https://github.com/dmitriyperetoka" target="_blank">dmitriyperetoka</a>
            </small>
        </footer>
    </div>

    <script>
        window.__initialData = {
            defaultImageUrl: "{{ default_image_url }}",
            defaultImageHash: "{{ scheme.image_hash }}",
            scheme: {{ scheme | tojson }}
        };
    </script>

    <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
    <script src="/static/js/mosaic.js"></script>
</body>
</html>
